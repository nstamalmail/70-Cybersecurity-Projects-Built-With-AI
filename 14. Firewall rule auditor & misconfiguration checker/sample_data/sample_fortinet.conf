config firewall policy
    edit 1
        set name "Allow-Internet-Web"
        set srcintf "lan"
        set dstintf "wan1"
        set srcaddr "Internal-Network"
        set dstaddr "all"
        set service "HTTP" "HTTPS"
        set action accept
        set schedule "always"
        set logtraffic all
        set nat enable
        set comments "Allow internal web browsing to internet"
    next

    edit 2
        set name "Block-Telnet-FTP"
        set srcintf "lan"
        set dstintf "wan1"
        set srcaddr "all"
        set dstaddr "all"
        set service "TELNET" "FTP"
        set action deny
        set schedule "always"
        set logtraffic all
        set comments "Block insecure protocols Telnet and FTP"
    next

    edit 3
        set name "Allow-DMZ-Servers"
        set srcintf "dmz"
        set dstintf "wan1"
        set srcaddr "DMZ-Servers"
        set dstaddr "all"
        set service "HTTP" "HTTPS"
        set action accept
        set schedule "always"
        set logtraffic all
        set comments "Allow DMZ servers outbound web access"
    next

    edit 4
        set name "Any-Any-Permissive"
        set srcintf "lan"
        set dstintf "wan1"
        set srcaddr "all"
        set dstaddr "all"
        set service "ALL"
        set action accept
        set schedule "always"
        set logtraffic disable
        set nat enable
    next

    edit 5
        set name "Allow-SSH-Management"
        set srcintf "mgmt"
        set dstintf "lan"
        set srcaddr "Admin-PC"
        set dstaddr "Server-Network"
        set service "SSH"
        set action accept
        set schedule "always"
        set logtraffic all
        set comments "Admin SSH access to servers"
    next

    edit 6
        set name "Allow-DNS"
        set srcintf "lan"
        set dstintf "wan1"
        set srcaddr "Internal-Network"
        set dstaddr "DNS-Servers"
        set service "DNS"
        set action accept
        set schedule "always"
        set logtraffic all
    next

    edit 7
        set name "Allow-VPN"
        set srcintf "vpn"
        set dstintf "lan"
        set srcaddr "Remote-VPN-Clients"
        set dstaddr "Internal-Network"
        set service "ALL"
        set action accept
        set schedule "always"
        set logtraffic all
        set comments "VPN client access - should restrict services"
    next

    edit 8
        set name "Allow-Database"
        set srcintf "lan"
        set dstintf "db-zone"
        set srcaddr "App-Servers"
        set dstaddr "Database-Server"
        set service "MySQL"
        set action accept
        set schedule "always"
        set logtraffic disable
    next

    edit 9
        set name "Block-Guest-Internal"
        set srcintf "guest"
        set dstintf "lan"
        set srcaddr "Guest-WiFi"
        set dstaddr "all"
        set service "ALL"
        set action deny
        set schedule "always"
        set logtraffic all
    next

    edit 10
        set name "Allow-SNMP"
        set srcintf "mgmt"
        set dstintf "lan"
        set srcaddr "NMS-Server"
        set dstaddr "all"
        set service "SNMP"
        set action accept
        set schedule "always"
        set logtraffic disable
    next

    edit 11
        set name "Legacy-RDP"
        set srcintf "lan"
        set dstintf "lan"
        set srcaddr "all"
        set dstaddr "all"
        set service "RDP"
        set action accept
        set schedule "always"
        set logtraffic disable
    next

    edit 12
        set name "Allow-Email"
        set srcintf "lan"
        set dstintf "wan1"
        set srcaddr "Internal-Network"
        set dstaddr "Mail-Server"
        set service "SMTP" "POP3" "IMAP"
        set action accept
        set schedule "always"
        set logtraffic all
        set comments "Email access - allow outbound"
    next

    edit 13
        set name "HTTP-Management"
        set srcintf "mgmt"
        set dstintf "lan"
        set srcaddr "Admin-PC"
        set dstaddr "FortiGate"
        set service "HTTP"
        set action accept
        set schedule "always"
        set logtraffic all
    next

    edit 14
        set name "Allow-Cloud-Access"
        set srcintf "lan"
        set dstintf "wan1"
        set srcaddr "Internal-Network"
        set dstaddr "Cloud-SaaS"
        set service "HTTPS"
        set action accept
        set schedule "always"
        set logtraffic all
    next

    edit 15
        set name "Default-Deny"
        set srcintf "any"
        set dstintf "any"
        set srcaddr "all"
        set dstaddr "all"
        set service "ALL"
        set action deny
        set schedule "always"
        set logtraffic all
        set comments "Default implicit deny all traffic"
    next
end
